[package]
name = "bye-preview"
version = "0.1.0-preview.1"
description = "Isolated BYE shared-app desktop trial"
authors = ["BYE contributors"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.48.0", features = ["sync", "macros"] }
regex = "=1.12.2"
open = "=5.3.2"
